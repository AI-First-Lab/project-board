/* Merge a parsed sheet into a project. Features match on Feature Group + Feature (case-insensitive);
   features missing from the sheet are kept. Returns what changed. */
function mergeInto(p,res){
  const st={added:[],updated:[],cells:{},newVersions:[]};
  res.releases.forEach(r=>{
    if(!p.releases.includes(r)){ p.releases.push(r); p.features.forEach(f=>f.releases[r]=0); st.newVersions.push(r); }
  });
  if(st.newVersions.length) sortVersions(p);
  const key=(g,f)=>norm(g)+'||'+norm(f);
  const index=new Map(p.features.map(f=>[key(f.featureGroup,f.feature),f]));
  res.features.forEach((nf,i)=>{
    const noCat=!res.hasCategory || (res.catMissing||[])[i];
    const m=index.get(key(nf.featureGroup,nf.feature));
    if(m){
      let meta=false; const cells=[];
      if(!noCat && nf.umbrella!==m.umbrella){ m.umbrella=nf.umbrella; meta=true; }
      if(nf.groupDesc && nf.groupDesc!==m.groupDesc){ m.groupDesc=nf.groupDesc; meta=true; }
      if(nf.featureDesc && nf.featureDesc!==m.featureDesc){ m.featureDesc=nf.featureDesc; meta=true; }
      res.releases.forEach(r=>{
        const v=nf.releases[r]===1?1:0;
        if((m.releases[r]===1?1:0)!==v){ m.releases[r]=v; cells.push(r); }
      });
      if((meta||cells.length) && !st.updated.includes(m._id) && !st.added.includes(m._id)){ st.updated.push(m._id); st.cells[m._id]=cells; }
      else if(cells.length && st.cells[m._id]) st.cells[m._id].push(...cells);
    }else{
      const f={...nf,_id:uid(),releases:{}};
      if(noCat){ const sib=p.features.find(x=>norm(x.featureGroup)===norm(f.featureGroup)); if(sib) f.umbrella=sib.umbrella; }
      p.releases.forEach(r=>f.releases[r]=nf.releases[r]===1?1:0);
      const at=lastIndexOfGroup(p.features,f.umbrella,f.featureGroup);
      if(at>=0) p.features.splice(at+1,0,f); else p.features.push(f);
      index.set(key(f.featureGroup,f.feature),f);
      st.added.push(f._id);
    }
  });
  return st;
}
/* keep numeric versions (v2.0, v2.1, v10.0) in numeric order */
function sortVersions(p){
  if(!p.releases.every(r=>/^v\d+(\.\d+)*$/.test(r))) return;
  const parts=r=>r.slice(1).split('.').map(Number);
  p.releases.sort((a,b)=>{ const x=parts(a), y=parts(b);
    for(let i=0;i<Math.max(x.length,y.length);i++){ const d=(x[i]||0)-(y[i]||0); if(d) return d; } return 0; });
}
function changeSummary(st){
  const bits=[];
  if(st.added.length) bits.push(`${st.added.length} new`);
  if(st.updated.length) bits.push(`${st.updated.length} updated`);
  if(st.newVersions.length) bits.push(`new version${st.newVersions.length>1?'s':''} ${st.newVersions.join(', ')}`);
  return bits.join(' · ');
}
function mergePreview(res){
  const st=mergeInto(structuredClone(project()),res);
  const s=changeSummary(st);
  return s ? `${s}. Features not in the sheet are kept.` : 'No changes — the table already matches this sheet.';
}

function confirmImport(){
  if(!importResult||importResult.errors.length) return;
  const p=project(); const res=importResult;
  importMarks={}; filters.changes=false;
  let msg;
  if(importMode==='replace'){
    p.releases=[...res.releases];
    p.features=res.features.map(f=>({...f,_id:uid()}));
    [p.releaseDates,p.rolloutDates].forEach(map=>Object.keys(map||{}).forEach(r=>{ if(!p.releases.includes(r)) delete map[r]; }));
    lastImport={projectId:p.id,file:importFile,replaced:true,count:p.features.length};
    msg=`${p.features.length} features replaced in ${p.name}.`;
  }else{
    const st=mergeInto(p,res);
    st.added.forEach(id=>importMarks[id]={kind:'new',cells:[]});
    st.updated.forEach(id=>importMarks[id]={kind:'upd',cells:st.cells[id]||[]});
    const s=changeSummary(st);
    lastImport = s ? {projectId:p.id,file:importFile,added:st.added.length,updated:st.updated.length,newVersions:st.newVersions} : null;
    if(!s){ closeModal(); toast('ok','Already up to date',`${importFile} matches ${p.name} — nothing to add.`); return; }
    msg=`${s} in ${p.name}.`;
  }
  collapsedUmb=new Set();
  if(isCumulative(p)) carryForward(p);   // the sheet's own story, nothing dropped later on
  markDirty(); closeModal(); renderAll();
  finishImport(msg);
}

/* ---------- Project sheet format (shared by the page and the generator) ----------
   One worksheet per project: Category | Feature Group | Feature | 2.0 | 2.1 … | Group Description | Feature Description
   plus a "Versions" worksheet: Project | Sheet | Version | Release Date                                  */
const VERSIONS_SHEET='Versions';
function versionHeader(r){ return /^v\d/i.test(r) ? r.slice(1) : 'Release '+r; }
function sheetNameFor(name,used){
  let base=String(name).replace(/[\[\]:*?\/\\]/g,' ').trim().slice(0,31)||'Project';
  if(base.toLowerCase()===VERSIONS_SHEET.toLowerCase()) base=base+' 1';
  let n=base, k=2;
  while(used.has(n.toLowerCase())){ const s=' '+(k++); n=base.slice(0,31-s.length)+s; }
  used.add(n.toLowerCase()); return n;
}
function buildWorkbook(projects){
  const wb=XLSX.utils.book_new(), used=new Set([VERSIONS_SHEET.toLowerCase()]);
  const meta=[['Project','Sheet','Version','Dev Done Date','Rollout Date']];
  projects.forEach(p=>{
    const sheet=sheetNameFor(p.name,used);
    const rows=[['Category','Feature Group','Feature',...p.releases.map(versionHeader),'Group Description','Feature Description']];
    p.features.forEach(f=>rows.push([f.umbrella,f.featureGroup,f.feature,
      ...p.releases.map(r=>f.releases[r]===1?1:0),f.groupDesc||'',f.featureDesc||'']));
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:26},{wch:28},{wch:40},...p.releases.map(()=>({wch:9})),{wch:40},{wch:48}];
    XLSX.utils.book_append_sheet(wb,ws,sheet);
    if(p.releases.length) p.releases.forEach(r=>meta.push([p.name,sheet,r,(p.releaseDates||{})[r]||'',(p.rolloutDates||{})[r]||'']));
    else meta.push([p.name,sheet,'','','']);
  });
  const ms=XLSX.utils.aoa_to_sheet(meta);
  ms['!cols']=[{wch:24},{wch:24},{wch:12},{wch:16},{wch:16}];
  XLSX.utils.book_append_sheet(wb,ms,VERSIONS_SHEET);
  return wb;
}

function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'')||'project'; }
function isoDate(v){
  if(v==null||v==='') return '';
  const pad=n=>String(n).padStart(2,'0');
  if(v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); return d?`${d.y}-${pad(d.m)}-${pad(d.d)}`:''; }
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const t=Date.parse(s); return isNaN(t)?'':isoDate(new Date(t));
}
/* Read every project worksheet (+ the Versions sheet) back into projects */
function readWorkbookProjects(wb){
  const metaName=wb.SheetNames.find(n=>n.toLowerCase()===VERSIONS_SHEET.toLowerCase());
  const meta={};
  if(metaName){
    XLSX.utils.sheet_to_json(wb.Sheets[metaName],{header:1,defval:null,blankrows:false,raw:true}).slice(1).forEach(r=>{
      const [pname,sheet,ver,date,rollout]=r;
      const key=String(sheet||pname||'').trim().toLowerCase(); if(!key) return;
      const m=meta[key]=meta[key]||{name:String(pname||sheet).trim(),order:[],dates:{},rollouts:{}};
      const v=ver==null?'':String(ver).trim();
      if(v){
        const vn=versionName(v)||v; m.order.push(vn);
        const d=isoDate(date); if(d) m.dates[vn]=d;
        const ro=isoDate(rollout); if(ro) m.rollouts[vn]=ro;
      }
    });
  }
  const used=new Set(), out=[];
  wb.SheetNames.forEach(sn=>{
    if(sn===metaName) return;
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null,blankrows:false,raw:false});
    if(!rows.length) return;
    const res=interpret(rows);
    const m=meta[sn.toLowerCase()]||{name:sn,order:[],dates:{},rollouts:{}};
    const releases=res.releases.length?res.releases:m.order;
    if(!res.features.length && !releases.length) return;
    const features=res.features.map(f=>{ const rel={}; releases.forEach(r=>rel[r]=f.releases[r]===1?1:0); return {...f,releases:rel}; });
    let id=slug(m.name), k=2; while(used.has(id)) id=slug(m.name)+'-'+(k++); used.add(id);
    out.push({id,name:m.name,releases,releaseDates:m.dates,rolloutDates:m.rollouts||{},features});
  });
  return out.length?out:null;
}

/* tiny IndexedDB store for the linked sheet's file handle */
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('project-board',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbSet(k,v){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function linkedSheet(){ try{ return FS_OK ? await idbGet('sheet') : null; }catch(e){ return null; } }

/* Load projects from the project sheet: linked file, then data/project-board.xlsx next to the page,
   then (interactive only) ask the user to pick the file. */
async function loadProjectSheet(interactive){
  /* fallback: when the file itself carries no saved-on date, use the file's own timestamp */
  const stamp=v=>{ const t=v?+new Date(v):NaN; if(!isNaN(t)) sheetUpdatedAt=t; };
  const read=async (buf,fallback)=>{
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    stamp(fallback);
    if(wb.Props && wb.Props.ModifiedDate) stamp(wb.Props.ModifiedDate);
    return readWorkbookProjects(wb);
  };
  const hnd=await linkedSheet();
  if(hnd){
    try{
      let perm=await hnd.queryPermission({mode:'read'});
      if(perm==='prompt' && interactive) perm=await hnd.requestPermission({mode:'read'});
      if(perm==='granted'){ const file=await hnd.getFile(); return await read(await file.arrayBuffer(),file.lastModified); }
    }catch(e){}
  }
  try{
    const r=await fetch(SHEET_PATH,{cache:'no-store'});
    if(r.ok) return await read(await r.arrayBuffer(), r.headers.get('Last-Modified'));
  }catch(e){ /* file:// pages cannot fetch; fall through */ }
  if(interactive && FS_OK){
    try{
      const [picked]=await window.showOpenFilePicker({id:'project-sheet',types:[XLSX_TYPE]});
      await idbSet('sheet',picked); sheetName=picked.name;
      const file=await picked.getFile();
      return await read(await file.arrayBuffer(),file.lastModified);
    }catch(e){ if(e.name!=='AbortError') toast('err','Could not read the sheet',e.message); }
  }
  return null;
}

/* Write all projects to the linked sheet. interactive: may ask for permission;
   pick: may ask the user to choose the file (first time). */
function sheetBytes(){ return XLSX.write(buildWorkbook(PROJECTS),{type:'array',bookType:'xlsx'}); }
/* When the page is served by server.js, the sheet is written on the server — no dialog, no permissions. */
async function saveViaServer(){
  if(!/^https?:$/.test(location.protocol)) return false;
  try{
    const r=await fetch(new URL('api/save-sheet',location.href),
      {method:'POST',headers:{'Content-Type':'application/octet-stream'},body:sheetBytes()});
    if(!r.ok) return false;
    serverSave=true; sheetName=SHEET_PATH; sheetDirty=false; sheetUpdatedAt=Date.now();
    saveLocal(); updateSheetStatus(); renderBoardFooter();
    return true;
  }catch(e){ return false; }
}
async function saveToSheet(interactive,pick){
  if(await saveViaServer()) return true;
  if(!FS_OK){
    if(!pick) return false;
    downloadSheet(); sheetDirty=false; saveLocal(); updateSheetStatus(); return true;
  }
  try{
    let hnd=await linkedSheet();
    if(!hnd){
      if(!pick) return false;
      hnd=await window.showSaveFilePicker({suggestedName:SHEET_FILE,id:'project-sheet',types:[XLSX_TYPE]});
      await idbSet('sheet',hnd);
    }
    let perm=await hnd.queryPermission({mode:'readwrite'});
    if(perm==='prompt' && interactive) perm=await hnd.requestPermission({mode:'readwrite'});
    if(perm!=='granted') return false;
    const data=XLSX.write(buildWorkbook(PROJECTS),{type:'array',bookType:'xlsx'});
    const w=await hnd.createWritable(); await w.write(new Blob([data])); await w.close();
    sheetName=hnd.name; sheetDirty=false; sheetUpdatedAt=Date.now();
    saveLocal(); updateSheetStatus(); renderBoardFooter();
    return true;
  }catch(e){
    if(e.name!=='AbortError') toast('err','Could not update the project sheet',e.message);
    return false;
  }
}
function scheduleSheetSync(){
  clearTimeout(sheetTimer);
  sheetTimer=setTimeout(()=>saveToSheet(false,false),1200);   // silent: only when already allowed
}
/* After an import: write the project sheet straight away.
   With server.js this is automatic. Opened any other way, a page may not write to disk
   on its own, so the toast offers a one-off save instead of opening a dialog unasked. */
async function finishImport(msg){
  clearTimeout(sheetTimer);
  if(await saveToSheet(true,false)){                       // already linked and allowed
    toast('ok','Excel imported',`${msg} Project sheet updated.`);
    return;
  }
  toast('ok','Excel imported',`${msg} Saved in this browser; the sheet file was not updated.`,
    {label:FS_OK?'Save to sheet':'Download sheet',fn:saveToSheetNow});
}
async function saveToSheetNow(){
  if(await saveToSheet(true,true) && FS_OK) toast('ok','Project sheet updated',`Saved to ${sheetName||SHEET_FILE}.`);
}
function downloadSheet(){
  XLSX.writeFile(buildWorkbook(PROJECTS),SHEET_FILE);
  toast('ok','Sheet downloaded',`Replace ${SHEET_PATH} in the project with this file.`);
}
function updateSheetStatus(){
  const b=$('#btnSheet'); if(!b) return;
  b.classList.toggle('ok',!sheetDirty); b.classList.toggle('pending',sheetDirty);
  $('#sheetLbl').textContent = sheetDirty ? 'Sheet not updated' : 'Sheet up to date';
  b.title = sheetDirty ? 'Changes are saved in this browser but not yet in the project sheet'
                       : (serverSave?'Saved into data/project-board.xlsx by the local server'
                                    :'The project sheet matches the table'+(sheetName?` (${sheetName})`:''));
}
const SOURCE_LABEL={browser:'saved browser data',sheet:'project sheet','built-in':'built-in data'};
function openSheetMenu(btn){
  showPopover(btn,`
    <div class="pmeta">Loaded from <b>${SOURCE_LABEL[dataSource]}</b>.<br>${sheetName?`Linked sheet: <b>${esc(sheetName)}</b>`:(FS_OK?`Link <b>${SHEET_PATH}</b> to keep it updated.`:`This browser can't write files — download the sheet instead.`)}</div>
    <button class="pi" data-save>${I.check} ${FS_OK?'Save to project sheet':'Download updated sheet'}</button>
    ${FS_OK?`<button class="pi" data-link>${I.rename} Link a different sheet…</button>`:''}
    ${FS_OK?`<button class="pi" data-dl>${I.download} Download a copy</button>`:''}
    <div class="psep"></div>
    <button class="pi" data-reload>${I.refresh} Reload from project sheet</button>
    <button class="pi danger" data-clear>${I.trash} Clear browser data</button>`,
    {'[data-save]':saveToSheetNow,
     '[data-link]':async()=>{ try{ const hnd=await window.showSaveFilePicker({suggestedName:SHEET_FILE,id:'project-sheet',types:[XLSX_TYPE]}); await idbSet('sheet',hnd); sheetName=hnd.name; await saveToSheetNow(); }catch(e){ if(e.name!=='AbortError') toast('err','Could not link the sheet',e.message); } },
     '[data-dl]':downloadSheet,
     '[data-reload]':reloadFromSheet,
     '[data-clear]':()=>confirmDialog('Clear browser data?','Saved changes in this browser are removed and the page reloads from the project sheet. Changes not yet saved to the sheet are lost.',
        'Clear data',()=>{ try{ localStorage.removeItem(STORE_KEY); }catch(e){} location.reload(); })});
}
$('#btnSheet').onclick=e=>{ e.stopPropagation(); openSheetMenu($('#btnSheet')); };
async function reloadFromSheet(){
  const list=await loadProjectSheet(true);
  if(!list){ toast('warn','Project sheet not found',FS_OK?`Choose ${SHEET_PATH} to load it.`:'Open the page from a local server so the project sheet can be read.'); return; }
  setProjects(list); dataSource='sheet'; sheetDirty=false;
  importMarks={}; lastImport=null; collapsedUmb=new Set();
  filters={q:'',umb:'all',grp:'all',rel:'all',avail:'all',changes:false,newOnly:false};
  $('#searchInput').value=''; $('#searchBox').classList.remove('has');
  saveLocal(); renderAll(); updateSheetStatus();
  toast('ok','Reloaded from project sheet',`${list.length} project${list.length!==1?'s':''} loaded.`);
}

/* ============================================================
   Boot
   ============================================================ */
function renderAll(){
  renderProjectSidebar(); renderSummary();
  renderFilterOptions(); renderMatrix();
}
const SEED_MERGE_KEY='frm.seedMerge.v3';
/* Projects added to the built-in data after someone's browser copy was saved
   (TraceLens) are folded in once, so they do not have to reload from the sheet. */
const TRACELENS_FIX_KEY='frm.tracelens.v1only';
const RENAME_KEY='frm.renamed.v2', RENAMED={hrassist:'HR-Assist'};
const TA_DATA_KEY='frm.talentAssist.data.v1';   // the three Talent Assist sheets
const ACTIOX_DATA_KEY='frm.actiox.v3.v1';
const RA_VERSIONS_KEY='frm.releaseassist.v2names.v1'; // its columns became v2.0 / v2.1       // ActioX v3.0 / v3.1
const DATES_KEY='frm.releaseDates.v4';
const SEED_DATES={"releaseassist":{"v2.0":"2026-03-16","v2.1":"2026-09-15"},"actiox":{"v3.0":"2026-08-10","v3.1":"2026-10-15"},"proctorbg":{"v1.0":"2026-04-20","v1.1":"2026-08-17","v1.2":"2026-11-23"},"proctorgate":{"v1.0":"2026-05-11","v1.1":"2026-09-07","v1.2":"2026-12-14"},"hrassist":{"v1.0":"2026-03-09","v1.1":"2026-07-27","v1.2":"2026-11-09"}};
const ROLLOUTS_KEY='frm.rolloutDates.v2';
const SEED_ROLLOUTS={"livemeasure":{"v2.0":"2026-06-24","v2.1":"2026-08-05","v2.2":"2026-09-16","v2.3":"2026-11-05"},"actiox":{"v3.0":"2026-08-19","v3.1":"2026-10-18"},"hrassist":{"v1.0":"2026-03-19","v1.1":"2026-08-03","v1.2":"2026-11-13"},"proctorbg":{"v1.0":"2026-04-30","v1.1":"2026-08-25","v1.2":"2026-11-25"},"proctorgate":{"v1.0":"2026-05-20","v1.1":"2026-09-17","v1.2":"2026-12-20"},"releaseassist":{"v2.0":"2026-03-23","v2.1":"2026-09-19"}};
function withNewSeedProjects(list){
  try{
    /* TraceLens ships v1.0 only: replace a copy saved when it still had v1.1 and v1.2,
       unless it has been edited here since. */
    if(!localStorage.getItem(TRACELENS_FIX_KEY)){
      localStorage.setItem(TRACELENS_FIX_KEY,'1');
      const i=list.findIndex(p=>p.id==='tracelens'), seed=SEED.find(p=>p.id==='tracelens');
      if(i>=0 && seed && !list[i].updatedAt) list[i]=structuredClone(seed);
    }
    if(!localStorage.getItem(DATES_KEY)){
      localStorage.setItem(DATES_KEY,'1');
      Object.entries(SEED_DATES).forEach(([id,dates])=>{
        const pr=list.find(p=>p.id===id);
        if(pr) pr.releaseDates=Object.assign({},pr.releaseDates,dates);
      });
    }
    if(!localStorage.getItem(ROLLOUTS_KEY)){
      localStorage.setItem(ROLLOUTS_KEY,'1');
      Object.entries(SEED_ROLLOUTS).forEach(([id,dates])=>{
        const pr=list.find(p=>p.id===id);
        if(pr) pr.rolloutDates=Object.assign({},pr.rolloutDates,dates);
      });
    }
    if(!localStorage.getItem(RA_VERSIONS_KEY)){
      localStorage.setItem(RA_VERSIONS_KEY,'1');
      const i=list.findIndex(p=>p.id==='releaseassist'), seed=SEED.find(p=>p.id==='releaseassist');
      if(i>=0 && seed) list[i]=structuredClone(seed);
    }
    if(!localStorage.getItem(ACTIOX_DATA_KEY)){
      localStorage.setItem(ACTIOX_DATA_KEY,'1');
      const i=list.findIndex(p=>p.id==='actiox'), seed=SEED.find(p=>p.id==='actiox');
      if(i>=0 && seed) list[i]=structuredClone(seed);
    }
    if(!localStorage.getItem(TA_DATA_KEY)){
      localStorage.setItem(TA_DATA_KEY,'1');
      ['proctorbg','proctorgate','hrassist'].forEach(id=>{
        const i=list.findIndex(p=>p.id===id), seed=SEED.find(p=>p.id===id);
        if(i>=0 && seed) list[i]=structuredClone(seed);
      });
    }
    if(!localStorage.getItem(RENAME_KEY)){
      localStorage.setItem(RENAME_KEY,'1');
      list.forEach(p=>{ if(RENAMED[p.id]) p.name=RENAMED[p.id]; });
    }
    if(localStorage.getItem(SEED_MERGE_KEY)) return list;
    const extra=SEED.filter(sp=>!list.some(p=>p.id===sp.id));
    localStorage.setItem(SEED_MERGE_KEY,'1');
    if(extra.length) return list.concat(structuredClone(extra));
  }catch(e){}
  return list;
}
async function boot(){
  const saved=loadLocal();
  if(saved){
    dataSource='browser'; sheetDirty=!!saved.sheetDirty; currentId=saved.currentId;
    sheetUpdatedAt=saved.sheetUpdatedAt||null;
    setProjects(withNewSeedProjects(saved.projects));
    saveLocal();
  }else{
    const fromSheet=await loadProjectSheet(false);
    dataSource=fromSheet?'sheet':'built-in';
    setProjects(fromSheet||structuredClone(SEED));
    saveLocal();
  }
  renderAll();
  const hnd=await linkedSheet(); if(hnd) sheetName=hnd.name;
  updateSheetStatus();
}

const AUTH_KEY='frm.user';
const USERS={
  'relantoadmin@gmail.com':{pass:'998877', name:'Relanto Admin', role:'admin',  roleLabel:'Administrator'},
  'relanto@gmail.com':     {pass:'123456',  name:'Relanto',       role:'viewer', roleLabel:'Team member'}
};
let currentUser=null, booted=false;
function isAdmin(){ return !!currentUser && currentUser.role==='admin'; }
function applyPermissions(){
  $('#btnImport').hidden = !isAdmin();
}
function renderUserBox(){
  if(!currentUser) return;
  $('#ubAvatar').textContent = initials(currentUser.name);
  $('#ubName').textContent = currentUser.name;
  $('#ubRole').textContent = currentUser.roleLabel;
  $('#btnSignOut').title = `Sign out ${currentUser.email}`;
}
async function enterApp(email){
  currentUser={email, ...USERS[email]};
  try{ localStorage.setItem(AUTH_KEY,email); }catch(e){}
  $('#loginScreen').hidden=true;
  document.querySelector('.shell').hidden=false;
  renderUserBox(); applyPermissions();
  if(!booted){ booted=true; await boot(); }
}
function showLogin(msg){
  currentUser=null;
  document.querySelector('.shell').hidden=true;
  $('#loginScreen').hidden=false;
  const err=$('#loginErr');
  err.textContent=msg||''; err.classList.toggle('show',!!msg);
  $('#loginPass').value='';
  $('#loginEmail').focus();
}
function signOut(){
  try{ localStorage.removeItem(AUTH_KEY); }catch(e){}
  $('#loginEmail').value='';
  showLogin('');
}
$('#loginForm').onsubmit=e=>{
  e.preventDefault();
  const email=$('#loginEmail').value.trim().toLowerCase(), pass=$('#loginPass').value;
  const u=USERS[email];
  if(!u || u.pass!==pass){ showLogin('That email and password do not match an account.'); return; }
  $('#loginErr').classList.remove('show');
  enterApp(email);
};
$('#btnSignOut').onclick=()=>signOut();

(function initAuth(){
  let saved=null;
  try{ saved=localStorage.getItem(AUTH_KEY); }catch(e){}
  if(saved && USERS[saved]) enterApp(saved); else showLogin('');
})();
